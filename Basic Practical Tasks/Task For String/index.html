<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementing A Text Analysis Tool</title>

    <!-- main css  -->
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>

    <header></header>

    <main>
        <h1 style="text-align:center; margin-bottom:25px;">
            Text Analysis Tool
        </h1>

        <section class="input-field">
            <input type="text" name="word-analyzer" id="wordAnalyzer" placeholder="Enter your text here...">
            <button id="analyzeBtn">Analyze</button>
        </section>

        <section>
            <h2>Total Length</h2>
            <p id="totalLengthCharacters"></p>
        </section>

        <section>
            <h2>Word Count</h2>
            <p id="totalLengthWord"></p>
        </section>

        <section>
            <h2>Frequency of Words</h2>
            <p id="displayWordFrequency"></p>
        </section>
    </main>

    <footer></footer>

    <!-- main script file  -->
    <script src="script.js"></script>
</body>

</html>
