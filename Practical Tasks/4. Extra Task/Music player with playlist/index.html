<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>

    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>

    <header></header>

    <main>
        <!-- music section  -->
        <section class="music py">
            <div class="container">
                <div class="music-content text-center">
                    <h2>Music Player</h2>

                    <h3 id="currentSong">No Song Playing</h3>

                    <audio id="audioPlayer" controls controlslist="nodownload"></audio>

                    <div class="buttons">
                        <button onclick="playSong()">Play</button>
                        <button onclick="pauseSong()">Pause</button>
                        <button onclick="stopSong()">Stop</button>
                        <button onclick="shufflePlaylist()">Shuffle</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- your playlist section  -->
        <section class="playlist py">
            <div class="container">
                <div class="playlist-title text-center">
                    <h2>Your Playlist</h2>
                </div>
                <div class="playlist-content">
                    <table border="1" class="text-center">
                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="yourPlayList">

                        </tbody>
                    </table>
                </div>
            </div>
        </section>


        <!-- playlist section  -->
        <section class="playlist py">
            <div class="container">
                <div class="playlist-title text-center">
                    <h2>Playlist</h2>
                </div>
                <div class="playlist-content">
                    <table border="1" class="text-center">
                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tBody">

                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>



    <script src="script.js" type="text/javascript"></script>

</body>

</html>
